name: altium-cuentas-v26-simple
services:
  altium-financiero:
    build:
      context: .
      dockerfile: Dockerfile
    image: javierolo123/cuentas:v26-sin-ia
    ports:
      - "127.0.0.1:${ALTIUM_DOCKER_PORT:-8502}:8501"
    restart: unless-stopped
    volumes:
      - altium_data:/app/data
    environment:
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      MPLBACKEND: "Agg"
      MPLCONFIGDIR: "/tmp/matplotlib"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
volumes:
  altium_data:
